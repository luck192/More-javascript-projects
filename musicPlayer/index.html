<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music player</title>
    <link rel="stylesheet" href="style.css">
    <!-- //icons -->
    <script src="https://kit.fontawesome.com/03e2849709.js" crossorigin="anonymous"></script>
   
</head>
<body>
    <div class="musicplayer">
       
        <nav>
            <div class="circle">
                <i class="fa-solid fa-angle-left"></i>
            </div>
            <div class="searchbar">
                <input type="text" placeholder="Enter artist name" id="enterName">
                <img src="search.png" id="searchicon" alt="img">
            </div>
            <div class="circle">
                <i class="fa-solid fa-bars"></i>
            </div>
        </nav>

       <div class="songImg">
            <img id="songImgCover" src="468-thumbnail.png" >
       </div> 

        <h1 id="songName">song name</h1>
        <p id="artistName">Artist name </p>

        <audio  controls id="song" style="display: none;" >
            <!-- <source src ="Raabta Agent Vinod 128 Kbps.mp3"> -->
        </audio>

        <input type="range" value ="0" id="progress">

        <div class="controls">
            <div id="prevbtn" ><i class="fa-solid fa-backward"></i></div>

             <div id="playbtn">
                <i class="fa-solid fa-play"  id="ctrlicon"></i>
            </div>

            <div id="nxtbtn"><i class="fa-solid fa-forward"></i></div> 
        </div>

    </div>


    <script src="logic.js"></script>
</body>
</html>
